ars before any external escalation.","Next best action"),T("BR-N06","Suspend unfair letters","An automated letter scheduled while a dispute or hold is active is suspended.","Next best action"),T("BR-N07","Rising risk","Days to pay up by more than 10, or credit score down by more than 10: mark risk as rising and follow up sooner.","Next best action"),T("BR-N08","Cash-flow issue","If the customer says cash is tight, offer a payment arrangement. Up to 3 months needs no approval (default, to confirm with Vodafone).","Next best action"),T("BR-N09","No response","No response after 2 or more contact attempts over 10 days: escalate to the account manager, then the team leader.","Next best action"),T("BR-N10","Promise broken","Re-triage and contact the decision maker, not just the AP team.","Next best action"),T("BR-N11","Restriction review","Over 45 days overdue with no dispute, no blocker and no response: offer a restriction review. Never for critical services without extra approval.","Restriction"),T("BR-N12","Collector stays in control","Every action shows why, the evidence and the cash impact. The collector can accept, edit or reject it; rejecting needs a reason.","Next best action"),T("BR-N13","Order of actions","Risk and legal steps first, then fixing our own error (BR-P05), then cash that can be paid now, then cash that needs a fix first, then relationship and protection steps by date, then monitoring.","Next best action")]},{title:"Account manager",intro:"What each account manager response does, and its guardrails.",rules:[T("BR-A01","I'll contact the customer","Creates an account manager task with a due date. The collector carries on with admin and dispute work.","Account manager step"),T("BR-A02","Proceed, I’m aware","The collector leads all contact. The account manager is copied on the outcome.","Account manager step"),T("BR-A03","Request hold","Pauses outbound contact for up to 5 working days (default, to confirm with Vodafone). The team leader sees every hold."
